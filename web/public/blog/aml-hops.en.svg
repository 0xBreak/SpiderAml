<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" font-family="system-ui,sans-serif"><rect width="1200" height="470" fill="#070B14"/><text x="600" y="46" font-size="26" fill="#F3F6FB" text-anchor="middle" font-weight="700">One path of money, three ways to rate it</text><rect x="40" y="86" width="220" height="74" rx="12" fill="#0E1626" stroke="#FF5A4A" stroke-width="3"/><text x="150" y="130" font-size="16" fill="#F3F6FB" text-anchor="middle" font-weight="700">Address labelled “scam”</text><path d="M260 123 H330" stroke="#FF5A4A" stroke-width="3"/><path d="M340 123 l-14 -9 v18z" fill="#FF5A4A"/><rect x="340" y="86" width="220" height="74" rx="12" fill="#0E1626" stroke="#B7C1D1" stroke-width="3"/><text x="450" y="130" font-size="16" fill="#F3F6FB" text-anchor="middle" font-weight="700">Unlabelled address</text><path d="M560 123 H630" stroke="#B7C1D1" stroke-width="3"/><path d="M640 123 l-14 -9 v18z" fill="#B7C1D1"/><rect x="640" y="86" width="220" height="74" rx="12" fill="#0E1626" stroke="#B7C1D1" stroke-width="3"/><text x="750" y="130" font-size="16" fill="#F3F6FB" text-anchor="middle" font-weight="700">Unlabelled counterparty</text><path d="M860 123 H930" stroke="#B7C1D1" stroke-width="3"/><path d="M940 123 l-14 -9 v18z" fill="#B7C1D1"/><rect x="940" y="86" width="220" height="74" rx="12" fill="#0E1626" stroke="#6FE6FF" stroke-width="3"/><text x="1050" y="130" font-size="16" fill="#F3F6FB" text-anchor="middle" font-weight="700">Wallet being checked</text><text x="600" y="196" font-size="17" fill="#B7C1D1" text-anchor="middle" font-weight="400">3 steps from the flagged address to the wallet</text><rect x="40" y="226" width="355" height="190" rx="14" fill="#0E1626" stroke="#2A3448" stroke-width="2"/><text x="60" y="262" font-size="18" fill="#3DDC97" text-anchor="start" font-weight="700">Looks only at nearby labels</text><text x="60" y="292" font-size="16" fill="#B7C1D1" text-anchor="start" font-weight="400">No labels near the wallet; does</text><text x="60" y="316" font-size="16" fill="#B7C1D1" text-anchor="start" font-weight="400">not read the chain further</text><text x="375" y="396" font-size="52" fill="#3DDC97" text-anchor="end" font-weight="700">0</text><rect x="425" y="226" width="355" height="190" rx="14" fill="#0E1626" stroke="#2A3448" stroke-width="2"/><text x="445" y="262" font-size="18" fill="#FFB04A" text-anchor="start" font-weight="700">Counts the share of money along the chain</text><text x="445" y="292" font-size="16" fill="#B7C1D1" text-anchor="start" font-weight="400">Part of the amounts came from the</text><text x="445" y="316" font-size="16" fill="#B7C1D1" text-anchor="start" font-weight="400">flagged address via two</text><text x="445" y="340" font-size="16" fill="#B7C1D1" text-anchor="start" font-weight="400">intermediaries</text><text x="760" y="396" font-size="52" fill="#FFB04A" text-anchor="end" font-weight="700">30%</text><rect x="810" y="226" width="355" height="190" rx="14" fill="#0E1626" stroke="#2A3448" stroke-width="2"/><text x="830" y="262" font-size="18" fill="#6FE6FF" text-anchor="start" font-weight="700">Counts it as a weak hint</text><text x="830" y="292" font-size="16" fill="#B7C1D1" text-anchor="start" font-weight="400">A distant tie gives only a small</text><text x="830" y="316" font-size="16" fill="#B7C1D1" text-anchor="start" font-weight="400">addition to the score</text><text x="1145" y="396" font-size="52" fill="#6FE6FF" text-anchor="end" font-weight="700">5</text><text x="600" y="448" font-size="14" fill="#6D7787" text-anchor="middle" font-weight="400">A conditional example: the numbers are made up to show how approaches differ. All three answers can be honest.</text></svg>