<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" font-family="system-ui,sans-serif"><rect width="1200" height="470" fill="#070B14"/><text x="600" y="46" font-size="26" fill="#F3F6FB" text-anchor="middle" font-weight="700">Один путь денег, три способа его оценить</text><rect x="40" y="86" width="220" height="74" rx="12" fill="#0E1626" stroke="#FF5A4A" stroke-width="3"/><text x="150" y="130" font-size="16" fill="#F3F6FB" text-anchor="middle" font-weight="700">Адрес с меткой «скам»</text><path d="M260 123 H330" stroke="#FF5A4A" stroke-width="3"/><path d="M340 123 l-14 -9 v18z" fill="#FF5A4A"/><rect x="340" y="86" width="220" height="74" rx="12" fill="#0E1626" stroke="#B7C1D1" stroke-width="3"/><text x="450" y="130" font-size="16" fill="#F3F6FB" text-anchor="middle" font-weight="700">Адрес без метки</text><path d="M560 123 H630" stroke="#B7C1D1" stroke-width="3"/><path d="M640 123 l-14 -9 v18z" fill="#B7C1D1"/><rect x="640" y="86" width="220" height="74" rx="12" fill="#0E1626" stroke="#B7C1D1" stroke-width="3"/><text x="750" y="130" font-size="16" fill="#F3F6FB" text-anchor="middle" font-weight="700">Контрагент без метки</text><path d="M860 123 H930" stroke="#B7C1D1" stroke-width="3"/><path d="M940 123 l-14 -9 v18z" fill="#B7C1D1"/><rect x="940" y="86" width="220" height="74" rx="12" fill="#0E1626" stroke="#6FE6FF" stroke-width="3"/><text x="1050" y="130" font-size="16" fill="#F3F6FB" text-anchor="middle" font-weight="700">Проверяемый кошелёк</text><text x="600" y="196" font-size="17" fill="#B7C1D1" text-anchor="middle" font-weight="400">3 шага от помеченного адреса до кошелька</text><rect x="40" y="226" width="355" height="190" rx="14" fill="#0E1626" stroke="#2A3448" stroke-width="2"/><text x="60" y="262" font-size="18" fill="#3DDC97" text-anchor="start" font-weight="700">Смотрит только метки рядом</text><text x="60" y="292" font-size="16" fill="#B7C1D1" text-anchor="start" font-weight="400">Рядом с кошельком меток нет,</text><text x="60" y="316" font-size="16" fill="#B7C1D1" text-anchor="start" font-weight="400">цепочку дальше не читает</text><text x="375" y="396" font-size="52" fill="#3DDC97" text-anchor="end" font-weight="700">0</text><rect x="425" y="226" width="355" height="190" rx="14" fill="#0E1626" stroke="#2A3448" stroke-width="2"/><text x="445" y="262" font-size="18" fill="#FFB04A" text-anchor="start" font-weight="700">Считает долю денег по цепочке</text><text x="445" y="292" font-size="16" fill="#B7C1D1" text-anchor="start" font-weight="400">Часть сумм дошла от помеченного</text><text x="445" y="316" font-size="16" fill="#B7C1D1" text-anchor="start" font-weight="400">адреса через два посредника</text><text x="760" y="396" font-size="52" fill="#FFB04A" text-anchor="end" font-weight="700">30%</text><rect x="810" y="226" width="355" height="190" rx="14" fill="#0E1626" stroke="#2A3448" stroke-width="2"/><text x="830" y="262" font-size="18" fill="#6FE6FF" text-anchor="start" font-weight="700">Считает слабой подсказкой</text><text x="830" y="292" font-size="16" fill="#B7C1D1" text-anchor="start" font-weight="400">Дальняя связь даёт лишь небольшую</text><text x="830" y="316" font-size="16" fill="#B7C1D1" text-anchor="start" font-weight="400">добавку к оценке</text><text x="1145" y="396" font-size="52" fill="#6FE6FF" text-anchor="end" font-weight="700">5</text><text x="600" y="448" font-size="14" fill="#6D7787" text-anchor="middle" font-weight="400">Условный пример: цифры выдуманы, чтобы показать разницу подходов. Честными могут быть все три ответа.</text></svg>