<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 668" font-family="system-ui,-apple-system,Segoe UI,sans-serif"><rect width="1200" height="668" fill="#070B14"/><text x="600" y="54" font-size="36" fill="#F3F6FB" text-anchor="middle" font-weight="700">How far each approach “sees”</text><rect x="40" y="92" width="200" height="96" rx="16" fill="#0E1626" stroke="#FF5A4A" stroke-width="4"/><text x="140.0" y="134" font-size="25" fill="#F3F6FB" text-anchor="middle" font-weight="700">Flagged</text><text x="140.0" y="166" font-size="23" fill="#B7C1D1" text-anchor="middle" font-weight="400">address</text><path d="M248 140 H280" stroke="#FF5A4A" stroke-width="4" stroke-linecap="round"/><path d="M292 140 l-18 -11 v22z" fill="#FF5A4A"/><rect x="300" y="92" width="200" height="96" rx="16" fill="#0E1626" stroke="#B7C1D1" stroke-width="4"/><text x="400.0" y="134" font-size="25" fill="#F3F6FB" text-anchor="middle" font-weight="700">Address</text><text x="400.0" y="166" font-size="23" fill="#B7C1D1" text-anchor="middle" font-weight="400">no label</text><path d="M508 140 H540" stroke="#B7C1D1" stroke-width="4" stroke-linecap="round"/><path d="M552 140 l-18 -11 v22z" fill="#B7C1D1"/><rect x="560" y="92" width="200" height="96" rx="16" fill="#0E1626" stroke="#B7C1D1" stroke-width="4"/><text x="660.0" y="134" font-size="25" fill="#F3F6FB" text-anchor="middle" font-weight="700">Counterparty</text><text x="660.0" y="166" font-size="23" fill="#B7C1D1" text-anchor="middle" font-weight="400">no label</text><path d="M768 140 H800" stroke="#B7C1D1" stroke-width="4" stroke-linecap="round"/><path d="M812 140 l-18 -11 v22z" fill="#B7C1D1"/><rect x="820" y="92" width="200" height="96" rx="16" fill="#0E1626" stroke="#6FE6FF" stroke-width="4"/><text x="920.0" y="134" font-size="25" fill="#F3F6FB" text-anchor="middle" font-weight="700">Wallet</text><text x="920.0" y="166" font-size="23" fill="#B7C1D1" text-anchor="middle" font-weight="400">checked</text><text x="40" y="240" font-size="27" fill="#3DDC97" text-anchor="start" font-weight="700">Looks only at nearby labels</text><rect x="560" y="256" width="460" height="52" rx="14" fill="#3DDC97" opacity=".9"/><text x="1090" y="304" font-size="60" fill="#3DDC97" text-anchor="middle" font-weight="800">0</text><text x="40" y="370" font-size="27" fill="#FFB04A" text-anchor="start" font-weight="700">Counts the share of money along the chain</text><rect x="40" y="386" width="980" height="52" rx="14" fill="#FFB04A" opacity=".9"/><text x="1090" y="434" font-size="60" fill="#FFB04A" text-anchor="middle" font-weight="800">30%</text><text x="40" y="500" font-size="27" fill="#6FE6FF" text-anchor="start" font-weight="700">A distant tie as a weak hint</text><rect x="40" y="516" width="980" height="52" rx="14" fill="#6FE6FF" opacity=".22"/><rect x="40" y="516" width="980" height="52" rx="14" fill="none" stroke="#6FE6FF" stroke-width="3" stroke-dasharray="10 8"/><text x="1090" y="564" font-size="60" fill="#6FE6FF" text-anchor="middle" font-weight="800">5</text><text x="600" y="640" font-size="22" fill="#6D7787" text-anchor="middle" font-weight="400">A conditional example: the numbers are made up</text></svg>