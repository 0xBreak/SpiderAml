ke-width="3"/><text x="355.0" y="277" font-size="21" fill="#FFB04A" text-anchor="middle" font-weight="700">+500 USDT</text><text x="355.0" y="311" font-size="18" fill="#FF5A4A" text-anchor="middle" font-weight="700">lookalike</text><rect x="60" y="95" width="300" height="74" rx="16" fill="#F3F6FB"/><path d="M90 169 l-18 24 l42 -24z" fill="#F3F6FB"/><text x="76" y="125" font-size="19" fill="#0E1626" text-anchor="start" font-weight="400">Where is the money?</text><text x="76" y="151" font-size="19" fill="#0E1626" text-anchor="start" font-weight="400">I can’t sell the token…</text><rect x="560" y="110" width="580" height="320" rx="16" fill="#0a0f1a" stroke="#B7C1D1" stroke-width="3"/><text x="850" y="150" font-size="22" fill="#B7C1D1" text-anchor="middle" font-weight="700">Network explorer</text><rect x="585" y="171" width="530" height="56" rx="10" fill="#111a2c"/><text x="605" y="205" font-size="18" fill="#B7C1D1" text-anchor="start" font-weight="400">Token address in the wallet</text><text x="1095" y="205" font-size="22" fill="#FF5A4A" text-anchor="end" font-weight="700">does not match</text><rect x="585" y="241" width="530" height="56" rx="10" fill="#111a2c"/><text x="605" y="275" font-size="18" fill="#B7C1D1" text-anchor="start" font-weight="400">Real USDT at the address</text><text x="1095" y="275" font-size="22" fill="#FF5A4A" text-anchor="end" font-weight="700">0</text><rect x="585" y="311" width="530" height="56" rx="10" fill="#111a2c"/><text x="605" y="345" font-size="18" fill="#B7C1D1" text-anchor="start" font-weight="400">Confirmed transfers</text><text x="1095" y="345" font-size="22" fill="#FF5A4A" text-anchor="end" font-weight="700">none</text><rect x="40" y="470" width="1120" height="110" rx="14" fill="#0a0f1a" stroke="#2A3448" stroke-width="2"/><rect x="40" y="470" width="8" height="110" rx="4" fill="#6FE6FF"/><text x="66" y="502" font-size="18" fill="#6FE6FF" text-anchor="start" font-weight="700">What is happening</text><text x="66" y="534" font-size="19" fill="#F3F6FB" text-anchor="start" font-weight="400">The seller opens a network explorer and sees that no real USDT reached the address.</text><text x="66" y="562" font-size="19" fill="#F3F6FB" text-anchor="start" font-weight="400">The token in the wallet is a copy with the same name, and nobody will buy it. The account is already with the “buyer”.</text></svg>