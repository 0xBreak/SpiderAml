<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 490" font-family="system-ui,sans-serif"><rect width="1200" height="490" fill="#070B14"/><text x="600" y="48" font-size="26" fill="#F3F6FB" text-anchor="middle" font-weight="700">Как контракт USDT проверяет перевод</text><rect x="30" y="80" width="330" height="340" rx="14" fill="#0E1626" stroke="#2A3448" stroke-width="2"/><text x="195" y="114" font-size="19" fill="#FFB04A" text-anchor="middle" font-weight="700">Владелец контракта (Tether)</text><rect x="50" y="140" width="290" height="62" rx="10" fill="#16213A" stroke="#2A3448"/><text x="66" y="166" font-size="17" fill="#F3F6FB" text-anchor="start" font-weight="700">addBlackList</text><text x="66" y="188" font-size="14" fill="#B7C1D1" text-anchor="start" font-weight="400">добавить адрес в список</text><rect x="50" y="218" width="290" height="62" rx="10" fill="#16213A" stroke="#2A3448"/><text x="66" y="244" font-size="17" fill="#F3F6FB" text-anchor="start" font-weight="700">removeBlackList</text><text x="66" y="266" font-size="14" fill="#B7C1D1" text-anchor="start" font-weight="400">убрать из списка</text><rect x="50" y="296" width="290" height="62" rx="10" fill="#16213A" stroke="#2A3448"/><text x="66" y="322" font-size="17" fill="#F3F6FB" text-anchor="start" font-weight="700">destroyBlackFunds</text><text x="66" y="344" font-size="14" fill="#B7C1D1" text-anchor="start" font-weight="400">обнулить баланс адреса из списка</text><text x="195" y="400" font-size="14" fill="#B7C1D1" text-anchor="middle" font-weight="400">Вызвать может только владелец</text><rect x="440" y="80" width="320" height="340" rx="14" fill="#0E1626" stroke="#2A3448" stroke-width="2"/><text x="600" y="114" font-size="20" fill="#6FE6FF" text-anchor="middle" font-weight="700">Контракт USDT</text><text x="600" y="140" font-size="14" fill="#B7C1D1" text-anchor="middle" font-weight="400">таблица: адрес → в списке?</text><rect x="462" y="168" width="276" height="54" rx="10" fill="#16213A" stroke="#2A3448"/><text x="480" y="201" font-size="18" fill="#F3F6FB" text-anchor="start" font-weight="400">Адрес A</text><text x="718" y="201" font-size="18" fill="#3DDC97" text-anchor="end" font-weight="700">нет</text><rect x="462" y="238" width="276" height="54" rx="10" fill="#16213A" stroke="#2A3448"/><text x="480" y="271" font-size="18" fill="#F3F6FB" text-anchor="start" font-weight="400">Адрес B</text><text x="718" y="271" font-size="18" fill="#FF5A4A" text-anchor="end" font-weight="700">ДА</text><rect x="462" y="308" width="276" height="54" rx="10" fill="#16213A" stroke="#2A3448"/><text x="480" y="341" font-size="18" fill="#F3F6FB" text-anchor="start" font-weight="400">Адрес C</text><text x="718" y="341" font-size="18" fill="#3DDC97" text-anchor="end" font-weight="700">нет</text><rect x="840" y="80" width="330" height="340" rx="14" fill="#0E1626" stroke="#2A3448" stroke-width="2"/><text x="1005" y="114" font-size="20" fill="#F3F6FB" text-anchor="middle" font-weight="700">Что произойдёт</text><rect x="860" y="140" width="290" height="74" rx="10" fill="#16213A" stroke="#3DDC97" stroke-width="2"/><text x="884" y="186" font-size="30" fill="#3DDC97" text-anchor="middle" font-weight="700">✓</text><text x="910" y="172" font-size="16" fill="#F3F6FB" text-anchor="start" font-weight="700">Перевод С адреса A</text><text x="910" y="196" font-size="15" fill="#3DDC97" text-anchor="start" font-weight="400">проходит</text><rect x="860" y="230" width="290" height="74" rx="10" fill="#16213A" stroke="#FF5A4A" stroke-width="2"/><text x="884" y="276" font-size="30" fill="#FF5A4A" text-anchor="middle" font-weight="700">✗</text><text x="910" y="262" font-size="16" fill="#F3F6FB" text-anchor="start" font-weight="700">Перевод С адреса B</text><text x="910" y="286" font-size="15" fill="#FF5A4A" text-anchor="start" font-weight="400">отклонён</text><rect x="860" y="320" width="290" height="74" rx="10" fill="#16213A" stroke="#3DDC97" stroke-width="2"/><text x="884" y="366" font-size="30" fill="#3DDC97" text-anchor="middle" font-weight="700">✓</text><text x="910" y="352" font-size="16" fill="#F3F6FB" text-anchor="start" font-weight="700">Перевод НА адрес B</text><text x="910" y="376" font-size="15" fill="#3DDC97" text-anchor="start" font-weight="400">проходит: получить можно</text><path d="M360 250 H430" stroke="#B7C1D1" stroke-width="3"/><path d="M440 250 l-14 -9 v18z" fill="#B7C1D1"/><path d="M760 250 H830" stroke="#B7C1D1" stroke-width="3"/><path d="M840 250 l-14 -9 v18z" fill="#B7C1D1"/><text x="600" y="462" font-size="14" fill="#6D7787" text-anchor="middle" font-weight="400">По исходному коду контракта USDT в Ethereum (Etherscan): transfer и transferFrom проверяют только отправителя.</text></svg>