<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" font-family="system-ui,sans-serif"><rect width="1200" height="520" fill="#070B14"/><text x="600" y="48" font-size="26" fill="#F3F6FB" text-anchor="middle" font-weight="700">Two different blocks: on chain and at an exchange</text><rect x="30" y="76" width="1140" height="380" rx="14" fill="#0E1626" stroke="#2A3448" stroke-width="2"/><text x="430" y="112" font-size="20" fill="#FFB04A" text-anchor="start" font-weight="700">Address blocked on chain</text><text x="830" y="112" font-size="20" fill="#6FE6FF" text-anchor="start" font-weight="700">Account blocked at an exchange</text><text x="50" y="160" font-size="17" fill="#B7C1D1" text-anchor="start" font-weight="400">Where the block is recorded</text><text x="430" y="160" font-size="17" fill="#F3F6FB" text-anchor="start" font-weight="400">in the USDT contract</text><text x="830" y="160" font-size="17" fill="#F3F6FB" text-anchor="start" font-weight="400">in the exchange's own database</text><path d="M45 180 H1155" stroke="#2A3448" stroke-width="1"/><text x="50" y="218" font-size="17" fill="#B7C1D1" text-anchor="start" font-weight="400">Who decides</text><text x="430" y="218" font-size="17" fill="#F3F6FB" text-anchor="start" font-weight="400">Tether</text><text x="830" y="218" font-size="17" fill="#F3F6FB" text-anchor="start" font-weight="400">the exchange</text><path d="M45 238 H1155" stroke="#2A3448" stroke-width="1"/><text x="50" y="276" font-size="17" fill="#B7C1D1" text-anchor="start" font-weight="400">What it looks like</text><text x="430" y="276" font-size="17" fill="#F3F6FB" text-anchor="start" font-weight="400">the transfer is rejected</text><text x="830" y="276" font-size="17" fill="#F3F6FB" text-anchor="start" font-weight="400">withdrawal “under review”</text><path d="M45 296 H1155" stroke="#2A3448" stroke-width="1"/><text x="50" y="334" font-size="17" fill="#B7C1D1" text-anchor="start" font-weight="400">Where to check</text><text x="430" y="334" font-size="17" fill="#F3F6FB" text-anchor="start" font-weight="400">frozen page, block explorer</text><text x="830" y="334" font-size="17" fill="#F3F6FB" text-anchor="start" font-weight="400">exchange support in the app</text><path d="M45 354 H1155" stroke="#2A3448" stroke-width="1"/><text x="50" y="392" font-size="17" fill="#B7C1D1" text-anchor="start" font-weight="400">Who can lift it</text><text x="430" y="392" font-size="17" fill="#F3F6FB" text-anchor="start" font-weight="400">only Tether</text><text x="830" y="392" font-size="17" fill="#F3F6FB" text-anchor="start" font-weight="400">only the exchange</text><text x="600" y="490" font-size="15" fill="#6D7787" text-anchor="middle" font-weight="400">The two are independent: you can have one, the other or both at once.</text></svg>