<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 572" font-family="system-ui,-apple-system,Segoe UI,sans-serif"><rect width="1200" height="572" fill="#070B14"/><text x="600" y="54" font-size="36" fill="#F3F6FB" text-anchor="middle" font-weight="700">Две разные блокировки</text><rect x="30" y="86" width="1140" height="420" rx="18" fill="#0E1626" stroke="#2A3448" stroke-width="2"/><text x="430" y="136" font-size="29" fill="#FFB04A" text-anchor="start" font-weight="700">Адрес в сети</text><text x="800" y="136" font-size="29" fill="#6FE6FF" text-anchor="start" font-weight="700">Счёт на бирже</text><text x="56" y="196" font-size="25" fill="#B7C1D1" text-anchor="start" font-weight="400">Где записана</text><text x="430" y="196" font-size="26" fill="#F3F6FB" text-anchor="start" font-weight="400">в контракте USDT</text><text x="800" y="196" font-size="26" fill="#F3F6FB" text-anchor="start" font-weight="400">в базе биржи</text><path d="M50 218 H1150" stroke="#2A3448" stroke-width="1"/><text x="56" y="258" font-size="25" fill="#B7C1D1" text-anchor="start" font-weight="400">Кто решает</text><text x="430" y="258" font-size="26" fill="#F3F6FB" text-anchor="start" font-weight="400">Tether</text><text x="800" y="258" font-size="26" fill="#F3F6FB" text-anchor="start" font-weight="400">биржа</text><path d="M50 280 H1150" stroke="#2A3448" stroke-width="1"/><text x="56" y="320" font-size="25" fill="#B7C1D1" text-anchor="start" font-weight="400">Как выглядит</text><text x="430" y="320" font-size="26" fill="#F3F6FB" text-anchor="start" font-weight="400">перевод отклоняется</text><text x="800" y="320" font-size="26" fill="#F3F6FB" text-anchor="start" font-weight="400">вывод «на проверке»</text><path d="M50 342 H1150" stroke="#2A3448" stroke-width="1"/><text x="56" y="382" font-size="25" fill="#B7C1D1" text-anchor="start" font-weight="400">Где проверить</text><text x="430" y="382" font-size="26" fill="#F3F6FB" text-anchor="start" font-weight="400">страница заморозок</text><text x="800" y="382" font-size="26" fill="#F3F6FB" text-anchor="start" font-weight="400">поддержка биржи</text><path d="M50 404 H1150" stroke="#2A3448" stroke-width="1"/><text x="56" y="444" font-size="25" fill="#B7C1D1" text-anchor="start" font-weight="400">Кто снимает</text><text x="430" y="444" font-size="26" fill="#F3F6FB" text-anchor="start" font-weight="400">только Tether</text><text x="800" y="444" font-size="26" fill="#F3F6FB" text-anchor="start" font-weight="400">только биржа</text><text x="600" y="542" font-size="21" fill="#6D7787" text-anchor="middle" font-weight="400">Они независимы: может быть одна, другая или обе сразу</text></svg>