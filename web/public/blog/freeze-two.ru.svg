<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" font-family="system-ui,sans-serif"><rect width="1200" height="520" fill="#070B14"/><text x="600" y="48" font-size="26" fill="#F3F6FB" text-anchor="middle" font-weight="700">Две разные блокировки: в сети и на бирже</text><rect x="30" y="76" width="1140" height="380" rx="14" fill="#0E1626" stroke="#2A3448" stroke-width="2"/><text x="430" y="112" font-size="20" fill="#FFB04A" text-anchor="start" font-weight="700">Адрес заблокирован в сети</text><text x="830" y="112" font-size="20" fill="#6FE6FF" text-anchor="start" font-weight="700">Счёт заблокирован на бирже</text><text x="50" y="160" font-size="17" fill="#B7C1D1" text-anchor="start" font-weight="400">Где записана блокировка</text><text x="430" y="160" font-size="17" fill="#F3F6FB" text-anchor="start" font-weight="400">в контракте USDT</text><text x="830" y="160" font-size="17" fill="#F3F6FB" text-anchor="start" font-weight="400">в базе самой биржи</text><path d="M45 180 H1155" stroke="#2A3448" stroke-width="1"/><text x="50" y="218" font-size="17" fill="#B7C1D1" text-anchor="start" font-weight="400">Кто решает</text><text x="430" y="218" font-size="17" fill="#F3F6FB" text-anchor="start" font-weight="400">Tether</text><text x="830" y="218" font-size="17" fill="#F3F6FB" text-anchor="start" font-weight="400">биржа</text><path d="M45 238 H1155" stroke="#2A3448" stroke-width="1"/><text x="50" y="276" font-size="17" fill="#B7C1D1" text-anchor="start" font-weight="400">Как выглядит</text><text x="430" y="276" font-size="17" fill="#F3F6FB" text-anchor="start" font-weight="400">перевод отклоняется</text><text x="830" y="276" font-size="17" fill="#F3F6FB" text-anchor="start" font-weight="400">вывод «на проверке»</text><path d="M45 296 H1155" stroke="#2A3448" stroke-width="1"/><text x="50" y="334" font-size="17" fill="#B7C1D1" text-anchor="start" font-weight="400">Где проверить</text><text x="430" y="334" font-size="17" fill="#F3F6FB" text-anchor="start" font-weight="400">страница заморозок, обозреватель</text><text x="830" y="334" font-size="17" fill="#F3F6FB" text-anchor="start" font-weight="400">поддержка биржи в приложении</text><path d="M45 354 H1155" stroke="#2A3448" stroke-width="1"/><text x="50" y="392" font-size="17" fill="#B7C1D1" text-anchor="start" font-weight="400">Кто может снять</text><text x="430" y="392" font-size="17" fill="#F3F6FB" text-anchor="start" font-weight="400">только Tether</text><text x="830" y="392" font-size="17" fill="#F3F6FB" text-anchor="start" font-weight="400">только биржа</text><text x="600" y="490" font-size="15" fill="#6D7787" text-anchor="middle" font-weight="400">Эти блокировки независимы: может быть одна, другая или обе сразу.</text></svg>