ct x="1028" y="330" width="92" height="62" rx="6" fill="#0a0f1a" stroke="#4a5470" stroke-width="2"/><rect x="940" y="140" width="200" height="46" rx="10" fill="#4a1d1d" stroke="#FF5A4A" stroke-width="2"/><text x="1040" y="170" font-size="17" fill="#ffb4ab" text-anchor="middle" font-weight="700" >Number spoofed</text><rect x="30" y="500" width="1140" height="110" rx="14" fill="#0a0f1a" stroke="#2A3448" stroke-width="2"/><rect x="30" y="500" width="8" height="110" rx="4" fill="#6FE6FF"/><text x="56" y="530" font-size="16" fill="#6FE6FF" text-anchor="start" font-weight="700" >What is happening</text><text x="56" y="562" font-size="18.5" fill="#F3F6FB" text-anchor="start" font-weight="400" >The scammer takes personal data from leaks, spoofs an email or number and scares you with a “breach”.</text><text x="56" y="590" font-size="18.5" fill="#F3F6FB" text-anchor="start" font-weight="400" >The “safe wallet” belongs to the scammer. Real support never does this.</text></svg>