idth="8" height="110" rx="4" fill="#6FE6FF"/><text x="56" y="530" font-size="16" fill="#6FE6FF" text-anchor="start" font-weight="700" >Что происходит</text><text x="56" y="562" font-size="18.5" fill="#F3F6FB" text-anchor="start" font-weight="400" >Тем, кто уже потерял деньги, пишут «специалисты по возврату» и просят оплату вперёд.</text><text x="56" y="590" font-size="18.5" fill="#F3F6FB" text-anchor="start" font-weight="400" >Оплата уходит, возврата нет: человек платит второй раз.</text></svg>