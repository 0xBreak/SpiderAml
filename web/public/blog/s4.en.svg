<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" font-family="system-ui,Noto Sans,sans-serif"><rect width="1200" height="660" fill="#0B1220"/><text x="600" y="50" font-size="27" fill="#F3F6FB" text-anchor="middle" font-weight="700" >Scheme 4. Cash into a crypto ATM</text><rect x="30" y="80" width="560" height="390" rx="18" fill="#121B2E" stroke="#2A3448" stroke-width="2"/><rect x="48" y="96" width="8" height="26" rx="4" fill="#6FE6FF"/><text x="66" y="117" font-size="18" fill="#6FE6FF" text-anchor="start" font-weight="700" >What the victim sees</text><rect x="610" y="80" width="560" height="390" rx="18" fill="#1a1018" stroke="#5a2a2a" stroke-width="2"/><rect x="628" y="96" width="8" height="26" rx="4" fill="#FF5A4A"/><text x="646" y="117" font-size="18" fill="#FF5A4A" text-anchor="start" font-weight="700" >What is really happening</text><rect x="56" y="318" width="148" height="140" rx="44" fill="#D9B53C"/><rect x="116" y="300" width="28" height="34" rx="10" fill="#F0C7A0"/><ellipse cx="130" cy="254" rx="44" ry="50" fill="#F0C7A0"/><ellipse cx="86" cy="260" rx="7" ry="12" fill="#F0C7A0"/><ellipse cx="174" cy="260" rx="7" ry="12" fill="#F0C7A0"/><path d="M82 246 q-2 -58 48 -58 q50 0 48 58z" fill="#3B6FD9"/><rect x="80" y="240" width="100" height="14" rx="7" fill="#2f58b3"/><circle cx="114" cy="252" r="4.4" fill="#1b1f2b"/><circle cx="146" cy="252" r="4.4" fill="#1b1f2b"/><path d="M104 239 q10 -5 20 0 M136 239 q10 -5 20 0" stroke="#2a211d" stroke-width="3.2" fill="none" stroke-linecap="round"/><path d="M127 260 q-5 12 3 13 h6" stroke="#00000030" stroke-width="3" fill="none" stroke-linecap="round"/><ellipse cx="130" cy="287" rx="7" ry="9" fill="#1b1f2b"/><circle cx="102" cy="278" r="7" fill="#ff8a7a" opacity=".3"/><circle cx="158" cy="278" r="7" fill="#ff8a7a" opacity=".3"/><rect x="300" y="150" width="250" height="300" rx="14" fill="#1d2740"/><rect x="316" y="168" width="218" height="120" rx="8" fill="#0a0f1a"/><text x="425" y="204" font-size="16" fill="#FFB04A" text-anchor="middle" font-weight="700" >CRYPTO ATM</text><text x="425" y="240" font-size="20" fill="#F3F6FB" text-anchor="middle" font-weight="700" >Cash ↓</text><rect x="340" y="330" width="170" height="16" rx="4" fill="#0a0f1a"/><rect x="340" y="360" width="170" height="70" rx="8" fill="#10182b"/><rect x="650" y="420" width="360" height="24" rx="6" fill="#1c2438"/><rect x="764" y="312" width="132" height="112" rx="40" fill="#3a4256"/><circle cx="830" cy="264" r="42" fill="#2a3146"/><path d="M784 258 a46 46 0 0 1 92 0" fill="none" stroke="#8a93a8" stroke-width="7"/><rect x="866" y="256" width="16" height="30" rx="8" fill="#8a93a8"/><path d="M874 286 q0 22 -26 24" fill="none" stroke="#8a93a8" stroke-width="4"/><rect x="660" y="330" width="92" height="62" rx="6" fill="#0a0f1a" stroke="#4a5470" stroke-width="2"/><rect x="908" y="330" width="92" height="62" rx="6" fill="#0a0f1a" stroke="#4a5470" stroke-width="2"/><rect x="640" y="135" width="240" height="62" rx="10" fill="#1b2438"/><text x="655" y="158" font-size="14.5" fill="#B7C1D1" text-anchor="start" font-weight="700" >“Bank employee”</text><text x="655" y="180" font-size="12.5" fill="#F3F6FB" text-anchor="start" font-weight="400" >Your money is at risk. Deposit it at the ATM.</text><rect x="900" y="135" width="250" height="50" rx="10" fill="#4a1d1d" stroke="#FF5A4A" stroke-width="2"/><text x="1025" y="166" font-size="14.5" fill="#ffb4ab" text-anchor="middle" font-weight="700" >address on screen is not yours</text><rect x="30" y="500" width="1140" height="110" rx="14" fill="#0a0f1a" stroke="#2A3448" stroke-width="2"/><rect x="30" y="500" width="8" height="110" rx="4" fill="#6FE6FF"/><text x="56" y="530" font-size="16" fill="#6FE6FF" text-anchor="start" font-weight="700" >What is happening</text><text x="56" y="562" font-size="18.5" fill="#F3F6FB" text-anchor="start" font-weight="400" >The caller poses as a bank or police and walks the victim to an ATM.</text><text x="56" y="590" font-size="18.5" fill="#F3F6FB" text-anchor="start" font-weight="400" >The cash becomes crypto and goes to the address the scammer dictated.</text></svg>