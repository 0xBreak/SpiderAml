0" height="190" rx="10" fill="#1d2740"/><rect x="298" y="178" width="254" height="174" rx="6" fill="#0a0f1a"/><path d="M270 360 h310 l-14 16 h-282z" fill="#2a3652"/><text x="425" y="214" font-size="22" fill="#FFB04A" text-anchor="middle" font-weight="700" >Free mint!</text><rect x="340" y="232" width="170" height="36" rx="8" fill="#1b2438"/><text x="425" y="256" font-size="14" fill="#6FE6FF" text-anchor="middle" font-weight="700" >Connect wallet</text><rect x="318" y="280" width="214" height="68" rx="8" fill="#111a2c" stroke="#FF5A4A" stroke-width="1.5"/><text x="425" y="302" font-size="13.5" fill="#F3F6FB" text-anchor="middle" font-weight="700" >Allow spending USDC</text><text x="425" y="320" font-size="12.5" fill="#FF5A4A" text-anchor="middle" font-weight="400" >Limit: unlimited</text><rect x="375" y="328" width="100" height="14" rx="4" fill="#FF5A4A"/><text x="425" y="340" font-size="11" fill="#fff" text-anchor="middle" font-weight="700" >Sign</text><path d="M700 300 H1090" stroke="#FF5A4A" stroke-width="4" stroke-dasharray="10 8"/><rect x="650" y="190" width="150" height="70" rx="10" fill="#0f2a22" stroke="#3DDC97" stroke-width="2"/><text x="725" y="232" font-size="22" fill="#3DDC97" text-anchor="middle" font-weight="700" >USDC</text><circle cx="1050" cy="300" r="44" fill="#2a1a1a" stroke="#FF5A4A" stroke-width="3"/><text x="1050" y="308" font-size="30" fill="#FF5A4A" text-anchor="middle" font-weight="700" >$</text><text x="900" y="350" font-size="18" fill="#ffb4ab" text-anchor="middle" font-weight="700" >Tokens drained</text><text x="900" y="280" font-size="24" fill="#FF5A4A" text-anchor="middle" font-weight="700" >→ → →</text><rect x="30" y="500" width="1140" height="110" rx="14" fill="#0a0f1a" stroke="#2A3448" stroke-width="2"/><rect x="30" y="500" width="8" height="110" rx="4" fill="#6FE6FF"/><text x="56" y="530" font-size="16" fill="#6FE6FF" text-anchor="start" font-weight="700" >What is happening</text><text x="56" y="562" font-size="18.5" fill="#F3F6FB" text-anchor="start" font-weight="400" >A trap site asks you to “confirm” entry to a giveaway. The signature (permit or approval) lets it spend your tokens.</text><text x="56" y="590" font-size="18.5" fill="#F3F6FB" text-anchor="start" font-weight="400" >The wallet is emptied with no password and no second confirmation.</text></svg>