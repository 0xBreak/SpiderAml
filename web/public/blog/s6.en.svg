t-anchor="start" font-weight="700" >0x4Ae7 <tspan fill="#FF5A4A">d4c8 77e3</tspan> c91D</text><text x="686" y="216" font-size="10" fill="#F3F6FB" text-anchor="start" font-weight="400" ></text><rect x="30" y="500" width="1140" height="110" rx="14" fill="#0a0f1a" stroke="#2A3448" stroke-width="2"/><rect x="30" y="500" width="8" height="110" rx="4" fill="#6FE6FF"/><text x="56" y="530" font-size="16" fill="#6FE6FF" text-anchor="start" font-weight="700" >What is happening</text><text x="56" y="562" font-size="18.5" fill="#F3F6FB" text-anchor="start" font-weight="400" >The scammer generates an address with the same first and last characters and sends a tiny transfer.</text><text x="56" y="590" font-size="18.5" fill="#F3F6FB" text-anchor="start" font-weight="400" >In wallet history it looks like a known recipient. Copy it and the money goes to the fake.</text></svg>