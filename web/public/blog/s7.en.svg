<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" font-family="system-ui,Noto Sans,sans-serif"><rect width="1200" height="660" fill="#0B1220"/><text x="600" y="50" font-size="27" fill="#F3F6FB" text-anchor="middle" font-weight="700" >Scheme 7. A token rises until it vanishes</text><rect x="30" y="80" width="560" height="390" rx="18" fill="#121B2E" stroke="#2A3448" stroke-width="2"/><rect x="48" y="96" width="8" height="26" rx="4" fill="#6FE6FF"/><text x="66" y="117" font-size="18" fill="#6FE6FF" text-anchor="start" font-weight="700" >What the victim sees</text><rect x="610" y="80" width="560" height="390" rx="18" fill="#1a1018" stroke="#5a2a2a" stroke-width="2"/><rect x="628" y="96" width="8" height="26" rx="4" fill="#FF5A4A"/><text x="646" y="117" font-size="18" fill="#FF5A4A" text-anchor="start" font-weight="700" >What is really happening</text><rect x="56" y="318" width="148" height="140" rx="44" fill="#D9B53C"/><rect x="116" y="300" width="28" height="34" rx="10" fill="#F0C7A0"/><ellipse cx="130" cy="254" rx="44" ry="50" fill="#F0C7A0"/><ellipse cx="86" cy="260" rx="7" ry="12" fill="#F0C7A0"/><ellipse cx="174" cy="260" rx="7" ry="12" fill="#F0C7A0"/><path d="M82 246 q-2 -58 48 -58 q50 0 48 58z" fill="#3B6FD9"/><rect x="80" y="240" width="100" height="14" rx="7" fill="#2f58b3"/><circle cx="114" cy="252" r="4.4" fill="#1b1f2b"/><circle cx="146" cy="252" r="4.4" fill="#1b1f2b"/><path d="M104 239 q10 -5 20 0 M136 239 q10 -5 20 0" stroke="#2a211d" stroke-width="3.2" fill="none" stroke-linecap="round"/><path d="M127 260 q-5 12 3 13 h6" stroke="#00000030" stroke-width="3" fill="none" stroke-linecap="round"/><ellipse cx="130" cy="287" rx="7" ry="9" fill="#1b1f2b"/><circle cx="102" cy="278" r="7" fill="#ff8a7a" opacity=".3"/><circle cx="158" cy="278" r="7" fill="#ff8a7a" opacity=".3"/><rect x="270" y="150" width="290" height="200" rx="12" fill="#0a0f1a" stroke="#B7C1D1" stroke-width="2"/><path d="M290 330 L330 322 L380 300 L440 250 L500 190 L540 170" stroke="#3DDC97" stroke-width="5" fill="none"/><text x="420" y="196" font-size="18" fill="#3DDC97" text-anchor="middle" font-weight="700" >$0.01 → $2,861</text><rect x="280" y="370" width="250" height="43" rx="14" fill="#F3F6FB"/><text x="294" y="397" font-size="16" fill="#0B1220" text-anchor="start" font-weight="400" >“Everyone is buying!”</text><path d="M650 360 L710 350 L770 320 L830 250 L870 160 L878 380 L1140 384" stroke="#FF5A4A" stroke-width="5" fill="none"/><text x="920" y="200" font-size="17" fill="#ffb4ab" text-anchor="start" font-weight="700" >Cannot sell</text><rect x="660" y="410" width="230" height="44" rx="10" fill="#4a1d1d" stroke="#FF5A4A" stroke-width="2"/><text x="775" y="438" font-size="15" fill="#ffb4ab" text-anchor="middle" font-weight="700" >Liquidity pool: 0</text><rect x="920" y="410" width="220" height="44" rx="10" fill="#1b2438"/><text x="1030" y="438" font-size="15" fill="#B7C1D1" text-anchor="middle" font-weight="700" >Site is down</text><rect x="30" y="500" width="1140" height="110" rx="14" fill="#0a0f1a" stroke="#2A3448" stroke-width="2"/><rect x="30" y="500" width="8" height="110" rx="4" fill="#6FE6FF"/><text x="56" y="530" font-size="16" fill="#6FE6FF" text-anchor="start" font-weight="700" >What is happening</text><text x="56" y="562" font-size="18.5" fill="#F3F6FB" text-anchor="start" font-weight="400" >The token is advertised and the price soars. Buyers cannot sell: the creators closed the exit and took the liquidity.</text><text x="56" y="590" font-size="18.5" fill="#F3F6FB" text-anchor="start" font-weight="400" >That is what happened to the SQUID token in November 2021: over 43,000 buyers, from one cent to $2,861 and almost to zero.</text></svg>